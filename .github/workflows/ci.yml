name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: typecheck · biome · jest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile)
        run: npm ci

      - name: AGENTS.md sincronizado com CLAUDE.md
        run: npm run check:agents

      - name: Typecheck
        run: npm run typecheck

      - name: Biome
        run: npm run check

      - name: Jest
        run: npm test -- --ci

  database:
    name: migration · RLS · generated types
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile)
        run: npm ci

      - name: Start disposable local Supabase
        run: npm run supabase:start

      - name: Migration up/down, constraints and RLS
        run: npm run test:db

      - name: Generated types match schema
        run: npm run check:db-types
